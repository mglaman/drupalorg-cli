name: PHP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        coverage: "none"
        php-version: "8.1"
        tools: composer:v2
    - name: Validate composer.json and composer.lock
      run: composer validate
  phpcs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        coverage: "none"
        php-version: "8.1"
        tools: composer:v2
    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: phpcs
      run: ./vendor/bin/phpcs src
  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        coverage: "none"
        php-version: "8.1"
        tools: composer:v2
    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: phpstan
      run: ./vendor/bin/phpstan analyse src

  phpunit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        coverage: "none"
        php-version: "8.1"
        tools: composer:v2
    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: phpunit
      run: ./vendor/bin/phpunit

  drupal-compat:
    # Checks that this package can be installed as a dependency of a Drupal
    # site, so its Symfony constraints don't conflict with Drupal core's.
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: "^10.6"
            php: "8.1"
          - drupal: "^11"
            php: "8.3"
          - drupal: "11.x-dev"
            php: "8.4"
    steps:
      - uses: actions/checkout@v7
        with:
          path: drupalorg-cli
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Create a Drupal project that requires this package
        run: |
          mkdir site && cd site
          cat > composer.json <<'JSON'
          {
            "name": "test/drupal-site",
            "version": "1.0.0",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {"type": "path", "url": "../drupalorg-cli", "options": {"versions": {"mglaman/drupalorg-cli": "999.0.0"}}},
              {"type": "composer", "url": "https://packages.drupal.org/8"}
            ],
            "config": {"allow-plugins": false}
          }
          JSON
          composer require --no-install --no-interaction "drupal/core-recommended:${{ matrix.drupal }}" "mglaman/drupalorg-cli:999.0.0"
          composer show --locked | grep -E '^(drupal/core |mglaman/drupalorg-cli|symfony/(console|finder|process) |mcp/sdk)'

  phar:
    runs-on: ubuntu-latest
    needs:
      - validate
      - phpstan
      - phpunit
    steps:
      - uses: actions/checkout@v7
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.2"
          tools: composer:v2
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-dev
      - name: Build phar
        run: |
          composer run box-install
          composer run box-build
          composer run box-info
      - name: Upload phar artifact
        uses: actions/upload-artifact@v7
        with:
          name: drupalorg-phar
          path: drupalorg.phar

  e2e:
    runs-on: ubuntu-latest
    needs:
      - validate
      - phpstan
      - phar
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
      - name: Download phar artifact
        uses: actions/download-artifact@v8
        with:
          name: drupalorg-phar
      - name: project:issues
        run: php drupalorg.phar project:issues address
      - name: project:kanban
        run: php drupalorg.phar project:kanban address
      - name: project:link
        run: php drupalorg.phar project:link address
      - name: project:releases
        run: php drupalorg.phar project:releases address
      - name: skill:install
        run: |
          php drupalorg.phar skill:install
          test -f .claude/skills/drupalorg-cli/SKILL.md
          test ! -d .claude/skills/drupalorg-issue-search
          test ! -d .claude/skills/drupalorg-issue-summary-update
          test ! -d .claude/skills/drupalorg-work-on-issue
          grep -q "drupalorg skill:get drupalorg-cli" .claude/skills/drupalorg-cli/SKILL.md
      - name: skill:get
        run: |
          php drupalorg.phar skill:get drupalorg-cli | grep -q "## Overview"
          php drupalorg.phar skill:get drupalorg-cli --full | grep -q "## Reference:"
          php drupalorg.phar skill:get drupalorg-issue-search | grep -q "drupalorg-issue-search"
          php drupalorg.phar skill:get drupalorg-work-on-issue | grep -q "drupalorg-work-on-issue"
